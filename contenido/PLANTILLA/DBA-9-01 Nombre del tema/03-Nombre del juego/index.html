<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plantilla de interactivo · AVACOM</title>

<!--
  ============================================================
  PLANTILLA PARA JUEGOS, ANIMACIONES E INTERACTIVOS
  ============================================================

  Copia esta carpeta entera, cambiala, y ya esta. No hace falta
  nada mas para que el componente la muestre.

  LAS TRES REGLAS QUE NO SE PUEDEN ROMPER

  1. NADA DE INTERNET. Ni una sola direccion que empiece por
     https://. El aula no tiene conexion. Un <script src="https://..">
     deja la pantalla EN BLANCO delante de treinta alumnos, sin
     ningun mensaje de error. Si necesitas una biblioteca,
     descargala y ponla en esta misma carpeta.

  2. EL PUNTO DE ENTRADA SE LLAMA index.html. Siempre.

  3. NADA DE localStorage NI sessionStorage. Esto se sirve desde
     una direccion que cambia en cada arranque, asi que lo que
     guardes ahi se pierde. Usa variables normales.

  Y las tres que se rompen sin querer:

  4. SE VE A CUATRO METROS. La pantalla mide 86 pulgadas y el
     ultimo alumno esta lejos. Nada por debajo de 20 pixeles.

  5. SE TOCA CON EL DEDO, NO CON EL RATON. Los botones, de 64
     pixeles de alto como minimo. No uses :hover para nada
     importante: en una pantalla tactil no existe.

  6. FUNCIONA A 1920x1080 Y TAMBIEN EN UNA TABLETA. Usa medidas
     relativas y prueba encogiendo la ventana.
  ============================================================
-->

<style>
  /* Los colores de la marca. Se pueden usar tal cual. */
  :root{
    --rojo:#E5262B;
    --papel:#E9EDF3;   /* gris papel, NO blanco: el blanco puro
                          deslumbra en 86 pulgadas a plena luz */
    --tinta:#1D1D1F;
    --suave:#6E6E73;
    --sombra:#C2C9D6;
    --bien:#1F8A4C;
    --mal:#E5262B;
  }

  *{box-sizing:border-box}

  body{
    margin:0; padding:32px;
    background:var(--papel); color:var(--tinta);
    /* Tipografia del sistema. NO uses una fuente descargada:
       si no carga, la pantalla se queda ilegible. */
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    font-size:20px;              /* el minimo. Nunca menos */
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh;
  }

  h1{font-size:38px; margin:0 0 6px; text-align:center}
  p.pista{font-size:22px; color:var(--suave); margin:0 0 32px; text-align:center}

  .tablero{
    display:flex; flex-wrap:wrap; gap:20px;
    justify-content:center; max-width:1100px; margin-bottom:32px;
  }

  /* Boton grande. 72 px de alto: se acierta con el dedo a la primera. */
  .ficha{
    min-height:72px; min-width:220px;
    padding:18px 28px;
    font-size:22px; font-family:inherit; color:var(--tinta);
    background:var(--papel); border:3px solid transparent; border-radius:18px;
    box-shadow:7px 7px 15px var(--sombra), -7px -7px 15px #fff;
    cursor:pointer; transition:transform .12s;
  }
  .ficha:active{transform:translateY(2px)}
  .ficha.bien{border-color:var(--bien)}
  .ficha.mal{border-color:var(--mal)}
  .ficha[disabled]{opacity:.55; cursor:default}

  #marcador{font-size:26px; font-weight:600; min-height:40px; text-align:center}

  .reiniciar{
    margin-top:24px; min-height:64px; padding:0 32px;
    font-size:20px; font-family:inherit;
    background:var(--rojo); color:#fff;
    border:none; border-radius:18px; cursor:pointer;
  }
</style>
</head>

<body>

<h1 id="titulo">Cuanto es 7 x 8?</h1>
<p class="pista">Toca la respuesta correcta</p>

<div class="tablero" id="tablero"></div>
<div id="marcador"></div>

<button class="reiniciar" onclick="empezar()">Otra vez</button>

<script>
/* ============================================================
   AQUI EMPIEZA LO TUYO. Cambia las preguntas y ya funciona.
   ============================================================ */

const PREGUNTAS = [
  { enunciado: "Cuanto es 7 x 8?",  opciones: ["54", "56", "48", "64"], correcta: 1 },
  { enunciado: "Cuanto es 9 x 6?",  opciones: ["54", "45", "56", "63"], correcta: 0 },
  { enunciado: "Cuanto es 12 x 4?", opciones: ["44", "46", "48", "52"], correcta: 2 }
];

let indice = 0, aciertos = 0;

function empezar(){
  indice = 0; aciertos = 0;
  document.getElementById('marcador').textContent = '';
  pintar();
}

function pintar(){
  const p = PREGUNTAS[indice];
  document.getElementById('titulo').textContent = p.enunciado;

  const tablero = document.getElementById('tablero');
  tablero.innerHTML = '';

  p.opciones.forEach((texto, i) => {
    const b = document.createElement('button');
    b.className = 'ficha';
    b.textContent = texto;
    b.onclick = () => responder(b, i === p.correcta);
    tablero.appendChild(b);
  });
}

function responder(boton, acierta){
  [...document.querySelectorAll('.ficha')].forEach(b => b.disabled = true);
  boton.classList.add(acierta ? 'bien' : 'mal');
  if (acierta) aciertos++;

  document.getElementById('marcador').textContent =
    acierta ? 'Correcto' : 'Todavia no. Mira otra vez.';

  setTimeout(() => {
    indice++;
    if (indice < PREGUNTAS.length) {
      pintar();
      document.getElementById('marcador').textContent = '';
    } else {
      terminar();
    }
  }, 1400);
}

function terminar(){
  document.getElementById('titulo').textContent = 'Terminado';
  document.getElementById('tablero').innerHTML = '';
  document.getElementById('marcador').textContent =
    aciertos + ' de ' + PREGUNTAS.length + ' correctas';

  /* OPCIONAL · avisar del resultado.
     Si el componente esta escuchando, se entera de como fue. Y si no
     esta, no pasa nada: por eso va dentro de un if. El interactivo
     tiene que funcionar igual abierto a pelo en un navegador. */
  if (window.avacom && window.avacom.terminado) {
    window.avacom.terminado({ aciertos: aciertos, total: PREGUNTAS.length });
  }
}

empezar();
</script>

</body>
</html>
